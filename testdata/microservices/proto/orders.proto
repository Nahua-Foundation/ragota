syntax = "proto3";

package orders;

option go_package = "example.com/microservices/proto/orders;orderspb";

// OrderService manages customer orders.
service OrderService {
  // CreateOrder creates a new order for a user.
  rpc CreateOrder (CreateOrderRequest) returns (CreateOrderResponse);
  // GetOrder returns an order by id.
  rpc GetOrder (GetOrderRequest) returns (Order);
}

message CreateOrderRequest {
  string user_id = 1;
  double amount = 2;
  repeated OrderItem items = 3;
}

message CreateOrderResponse {
  string order_id = 1;
  string status = 2;
}

message GetOrderRequest {
  string order_id = 1;
}

message Order {
  string order_id = 1;
  string user_id = 2;
  double amount = 3;
}

message OrderItem {
  string sku = 1;
  int32 quantity = 2;
}
