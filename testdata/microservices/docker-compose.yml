version: "3.9"

services:
  gateway:
    build: ./services/gateway
    ports:
      - "8080:8080"
    environment:
      ORDERS_GRPC_ADDR: orders:9090

  orders:
    build:
      context: ./services/orders
    environment:
      KAFKA_BROKERS: kafka:9092

  kafka:
    image: bitnami/kafka:3.6
    ports:
      - "9092:9092"
