# A release is a pushed tag. `make release VERSION=vX.Y.Z` tags and pushes;
# this workflow builds the whole matrix from that tag and publishes the
# GitHub release — scripts/release.sh is the single place the release logic
# lives, this file only hosts it.
#
# One macOS runner builds all four targets: both darwin architectures
# natively (Apple clang is a multi-arch compiler) and both linux
# architectures through zig as the cross C toolchain, musl-static — the same
# way `make release-snapshot` builds them on a maintainer machine.
#
# The workflow_dispatch door is the dry run: it builds the same matrix from
# any ref and uploads the artifacts to the workflow run, publishing nothing.
name: Release

on:
  push:
    tags: ["v[0-9]*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Snapshot version label, e.g. v0.0.0-dry (builds and uploads; publishes nothing)"
        required: true
        default: v0.0.0-dry

permissions:
  contents: write

jobs:
  release:
    name: build the matrix${{ github.event_name == 'push' && ' and publish' || ' (dry run)' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history: the release notes are the git log since the
          # previous tag, and --verify-tag needs the tag object itself.
          fetch-depth: 0

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install zig (the linux cross C toolchain)
        run: brew install zig

      - name: Build and publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/release.sh --from-tag "$GITHUB_REF_NAME"

      - name: Build the snapshot (dry run)
        if: github.event_name == 'workflow_dispatch'
        run: scripts/release.sh --snapshot "${{ inputs.version }}"

      - name: Upload the dry-run artifacts
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ragota-${{ inputs.version }}
          path: dist/${{ inputs.version }}/
          if-no-files-found: error
