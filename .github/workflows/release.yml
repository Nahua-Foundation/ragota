name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            goos: linux
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: amd64
          - os: macos-latest
            goos: darwin
            goarch: arm64

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: 'go.mod'
          cache: true

      - name: Build
        shell: bash
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 1
        run: |
          BINARY_NAME=ragota
          # Используем -ldflags для уменьшения размера и передачи версии, если нужно
          go build -v -o "$BINARY_NAME" ./cmd/ragota

      - name: Package
        shell: bash
        run: |
          BINARY_NAME=ragota
          ASSET_NAME="ragota-${{ matrix.goos }}-${{ matrix.goarch }}"
          
          mv "$BINARY_NAME" "$ASSET_NAME"
          
          echo "ASSET_PATH=${ASSET_NAME}" >> $GITHUB_ENV
          shasum -a 256 "${ASSET_NAME}" > "${ASSET_NAME}.sha256"
          echo "CHECKSUM_PATH=${ASSET_NAME}.sha256" >> $GITHUB_ENV

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ env.ASSET_PATH }}
            ${{ env.CHECKSUM_PATH }}
            docs/AGENTS.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
